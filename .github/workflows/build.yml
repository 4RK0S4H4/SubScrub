# Tests and the Windows build, on GitHub's Windows machines.
#   - every push and pull request: run the tests, build SubScrub.exe, attach it to the run as an artifact
#   - a tag like v2.7.3: also publish a GitHub Release with SubScrub.exe (the user downloads from there)
#   - "Run workflow" on main with a version typed in (e.g. 2.7.3): does the same and creates the tag itself
#   - every push and pull request: the whole test suite again on Linux (job "linux")
#   - every push and pull request: screenshots of every screen and dialog in both themes, on Linux, attached to the
#     run as the "screenshots" artifact for the visual check (generated sample videos only, never real media)
#   - every push and pull request: the new WinUI 3 app in winui/ (job "winui"): build it with its engine
#     (subscrub-core.exe, PyInstaller), then run its scripted QA on the generated sample library in both themes and a
#     small window: add, review, pick a title, save, and check the saved videos with ffprobe and mkvmerge. Attaches
#     the app folder ("SubScrub-WinUI") and the screenshots ("winui-screenshots"). Generated media only.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a Release for this version (e.g. 2.7.3). Must match subscrub/__init__.py. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write          # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      # the tools the app itself uses, so the save path is tested on real media on the real OS
      - name: Install FFmpeg and MKVToolNix
        run: choco install ffmpeg mkvtoolnix -y --no-progress

      # bash, not PowerShell: PowerShell carries on after a failing command in the middle of a script
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          SUBSCRUB_TEST_TIMEOUT: "240"
        run: |
          python -m tests.test_cleaner
          python -m tests.test_batch
          python -m tests.test_naming
          python -m tests.test_swap
          python -m tests.test_library
          python -m tests.test_updates
          python -m tests.test_ui
          python -m tests.test_pipeline
          python -m tests.test_edge
          python -m tests.test_helper

      - name: Build SubScrub.exe
        run: >
          python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --windowed
          --name SubScrub --icon assets\subscrub.ico --hidden-import PySide6.QtSvg --exclude-module tkinter run.py

      - name: Smoke-test the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SubScrub.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "SubScrub.exe exited straight away (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Build the installer (SubScrub-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (python -c "import subscrub; print(subscrub.__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\SubScrub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path dist\SubScrub-Setup.exe)) { throw "dist\SubScrub-Setup.exe was not made" }

      # install quietly like the in-app updater does, check it, start it, install over the top, uninstall
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          # not "Start-Process -Wait": a quiet install starts SubScrub itself, and -Wait would wait for the app too
          function Run-Quietly($file, $argList) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$file did not finish within 3 minutes" }
            return $p.ExitCode
          }
          $dir = Join-Path $env:RUNNER_TEMP "SubScrubInstalled"
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup.log")
          $code = Run-Quietly dist\SubScrub-Setup.exe $setupArgs
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "installer exit code $code" }
          foreach ($f in 'SubScrub.exe', 'unins000.exe') { if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" } }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\SubScrub.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut" }
          Start-Sleep -Seconds 8                    # a quiet install starts the app by itself
          $run = @(Get-Process SubScrub -ErrorAction SilentlyContinue)
          if ($run.Count -eq 0) { throw "the installed SubScrub did not start" }
          $run | Stop-Process -Force
          Start-Sleep -Seconds 2
          $code = Run-Quietly dist\SubScrub-Setup.exe $setupArgs                           # an upgrade over the top
          if ($code -ne 0) { throw "second install exit code $code" }
          Start-Sleep -Seconds 5
          Get-Process SubScrub -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $null = Run-Quietly "$dir\unins000.exe" @('/VERYSILENT', '/SUPPRESSMSGBOXES')
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\SubScrub.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\SubScrub.exe") { throw "the uninstaller left SubScrub.exe behind" }
          if (Test-Path $lnk) { throw "the uninstaller left the Start-menu shortcut" }

      - uses: actions/upload-artifact@v4
        with:
          name: SubScrub-exe
          path: |
            dist/SubScrub.exe
            dist/SubScrub-Setup.exe

      - name: Check the version matches before releasing
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Releases can only be started from main" }
          $v = python -c "import subscrub; print(subscrub.__version__)"
          if ($v.Trim() -ne "${{ inputs.version }}") { throw "Typed version ${{ inputs.version }} does not match subscrub/__init__.py ($v)" }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/SubScrub.exe
            dist/SubScrub-Setup.exe
          generate_release_notes: true

  # the same tests on Linux: fast, and a second opinion on paths and encodings
  linux:
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.version == ''"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          SUBSCRUB_TEST_TIMEOUT: "240"
        run: |
          python -m tests.test_cleaner
          python -m tests.test_batch
          python -m tests.test_naming
          python -m tests.test_swap
          python -m tests.test_library
          python -m tests.test_updates
          python -m tests.test_ui
          python -m tests.test_pipeline
          python -m tests.test_edge
          python -m tests.test_helper

  screenshots:
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.version == ''"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make the sample library
        run: python -m tests.make_samples --library

      - name: Screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/ui_screenshots.py screenshots samples/library dark --save
          python tools/ui_screenshots.py screenshots samples/library light --save
          python tools/ui_screenshots.py screenshots samples/library dark --size 1000x680

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

  # the native WinUI 3 app (winui/), in progress alongside the Python app: build it with its engine, then drive the
  # real flows on generated sample videos and check what it saved
  winui:
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.version == ''"
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python, FFmpeg and MKVToolNix
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          choco install ffmpeg mkvtoolnix -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco failed" }

      - name: Build (unpackaged, self-contained)
        shell: pwsh
        run: |
          dotnet publish winui/SubScrub/SubScrub.csproj -c Release -r win-x64 -p:Platform=x64 -o winui-out
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Get-ChildItem winui-out\*.pri)) { throw "no .pri file in the output: the XAML could not load" }
          Get-ChildItem winui-out\*.pri, winui-out\SubScrub.exe | Format-Table Name, Length

      # the engine: the Python cleaner, muxing, TMDB and safe swap as one folder, in "core" next to SubScrub.exe
      - name: Build the engine (subscrub-core.exe)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --log-level WARN --onedir --console --name subscrub-core `
            --distpath helper-dist --exclude-module PySide6 --exclude-module tkinter --hidden-import send2trash run_core.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Copy-Item -Recurse helper-dist\subscrub-core winui-out\core
          $reply = '{"id":1,"cmd":"hello","args":{}}' | & winui-out\core\subscrub-core.exe --settings "$env:RUNNER_TEMP\core-smoke.json"
          $reply | Select-Object -First 2
          if (-not ($reply -match '"ok":true')) { throw "the engine didn't answer" }

      - name: Make the sample library
        run: python -m tests.make_samples --library

      # the runner's screen is small; try for 1920x1080 so the on-screen shots aren't cramped
      - name: Screen size
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Scripted QA (add, review, title, settings, save) in both themes and a small window
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "winui-shots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $fail = @()
          foreach ($run in @(@('dark', '1920x1080', ''), @('light', '1920x1080', ''), @('dark', '1000x680', '-1000x680'))) {
            $t, $size, $tag = $run
            $lib = Join-Path $env:RUNNER_TEMP "library-$t$tag"
            if (Test-Path $lib) { Remove-Item -Recurse -Force $lib }
            Copy-Item -Recurse samples\library $lib
            $p = Start-Process winui-out\SubScrub.exe -ArgumentList "--shots", "`"$dir`"", "--library", "`"$lib`"", "--theme", $t, "--size", $size -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(1200000)) { $p.Kill(); $fail += "QA run ($t$tag) did not finish" }
            if (Test-Path "$dir\diagnose.txt") { Write-Host "--- XAML check ($t$tag)"; Get-Content "$dir\diagnose.txt"; Remove-Item "$dir\diagnose.txt" }
            if (Test-Path "$dir\crash.txt") { Get-Content "$dir\crash.txt"; $fail += "SubScrub crashed ($t$tag)"; Remove-Item "$dir\crash.txt" }
            if (Test-Path "$dir\problems-$t$tag.txt") { Get-Content "$dir\problems-$t$tag.txt"; $fail += "QA problems ($t$tag)" }
            Write-Host "--- timings ($t$tag)"
            if (Test-Path "$dir\timings-$t$tag.txt") { Get-Content "$dir\timings-$t$tag.txt" }
            if (Test-Path "$dir\qa-$t$tag.json") {
              Write-Host "--- saved videos ($t$tag)"
              python tools/winui_qa_check.py "$dir\qa-$t$tag.json" samples\library
              if ($LASTEXITCODE -ne 0) { $fail += "saved videos are wrong ($t$tag)" }
            } else { $fail += "no qa-$t$tag.json: the save didn't finish" }
          }
          Get-ChildItem $dir | Format-Table Name, Length
          if (Test-Path "$dir\screen-capture-errors.txt") { Get-Content "$dir\screen-capture-errors.txt" }
          if ($fail.Count -gt 0) { throw ($fail -join "; ") }

      - uses: actions/upload-artifact@v4
        with:
          name: SubScrub-WinUI
          path: winui-out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winui-screenshots
          path: winui-shots/
          if-no-files-found: warn

      # artifact downloads are blocked from cloud Claude sessions, so the same images also go to a throwaway branch
      # (sample data only; force-pushed each run, never merged)
      - name: Publish the screenshots to the winui-screenshots branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          [ -d winui-shots ] || exit 0
          cd winui-shots
          git init -q -b winui-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "WinUI screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" winui-screenshots
