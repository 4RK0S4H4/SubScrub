# Tests and the Windows build of SubScrub (the native WinUI 3 app in winui/, its C# engine in winui/SubScrub.Engine).
#   - every push and pull request, job "engine" (Linux): make the generated sample videos (tests/make_samples.py, the
#     only Python left, with FFmpeg and MKVToolNix), check the engine against the frozen answers of the retired
#     Python engine (tests/golden) and run its own tests on real videos. Generated media only, never real files.
#   - every push and pull request, job "winui" (Windows): build the app, run the engine tests with Windows' Recycle
#     Bin, Restart Manager and path rules, run the scripted QA on the sample library in both themes and a small
#     window (add, review, pick a title, save, then check the saved videos), build SubScrub-Setup.exe and install,
#     upgrade and uninstall it quietly. Attaches the installer, the app folder and the screenshots.
#   - "Run workflow" on main with a version typed in (e.g. 4.0.1), or a vX.Y.Z tag: job "release" builds the app and
#     its installer, checks the version matches winui/SubScrub/SubScrub.csproj, creates the tag and publishes the
#     GitHub Release with SubScrub-Setup.exe and the app as a zip (the user downloads from there)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a Release for this version (e.g. 4.0.1). Must match winui/SubScrub/SubScrub.csproj. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write          # needed to create releases on tags

jobs:
  # the C# engine on Linux: fast, and a second opinion on paths and encodings
  engine:
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.version == ''"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Make the sample videos
        run: |
          python3 -m tests.make_samples --library
          python3 -m tests.make_samples --edge
          python3 -m tests.make_samples

      # every cleaner call, view, question, read, save, title match and command the retired Python engine answered,
      # replayed on the C# engine and compared line by line (tests/golden/README.md)
      - name: Golden check (the C# engine against the retired Python engine's answers)
        run: dotnet run --project winui/SubScrub.Engine.Parity -c Release -- golden tests/golden .

      - name: C# engine tests
        run: dotnet run --project winui/SubScrub.Engine.Tests -c Release -- .

      # the same generated videos drive the WinUI app's QA run on Windows (making them there is too slow)
      - uses: actions/upload-artifact@v4
        with:
          name: sample-library
          path: samples/library/
          if-no-files-found: error
          retention-days: 3

  # the app: build it with its engine, then drive the real flows on generated sample videos and check what it saved
  winui:
    if: "!startsWith(github.ref, 'refs/tags/') && inputs.version == ''"
    needs: engine
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and MKVToolNix
        shell: pwsh
        run: |
          choco install ffmpeg mkvtoolnix -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco failed" }

      - name: Build (unpackaged, self-contained)
        shell: pwsh
        run: |
          dotnet publish winui/SubScrub/SubScrub.csproj -c Release -r win-x64 -p:Platform=x64 -o winui-out
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Get-ChildItem winui-out\*.pri)) { throw "no .pri file in the output: the XAML could not load" }
          Get-ChildItem winui-out\*.pri, winui-out\SubScrub.exe | Format-Table Name, Length
          $size = (Get-ChildItem winui-out -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("App folder: {0:N1} MB in {1} files" -f ($size / 1MB), (Get-ChildItem winui-out -Recurse -File).Count)

      - uses: actions/download-artifact@v4
        with:
          name: sample-library
          path: samples/library

      # the C# engine's own tests with Windows' Recycle Bin, Restart Manager and path rules
      - name: C# engine tests on Windows
        shell: pwsh
        run: |
          python -m tests.make_samples
          if ($LASTEXITCODE -ne 0) { throw "couldn't make the samples" }
          python -m tests.make_samples --edge
          if ($LASTEXITCODE -ne 0) { throw "couldn't make the edge cases" }
          dotnet build winui/SubScrub.Engine.Tests -c Release
          dotnet run --project winui/SubScrub.Engine.Tests -c Release --no-build -- .
          if ($LASTEXITCODE -ne 0) { throw "the C# engine tests failed" }

      # the runner's screen is small; try for 1920x1080 so the on-screen shots aren't cramped
      - name: Screen size
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Scripted QA (add, review, title, settings, save) in both themes and a small window
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "winui-shots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $fail = @()
          foreach ($run in @(@('dark', '1920x1080', ''), @('light', '1920x1080', ''), @('dark', '1000x680', '-1000x680'))) {
            $t, $size, $tag = $run
            $lib = Join-Path $env:RUNNER_TEMP "library-$t$tag"
            if (Test-Path $lib) { Remove-Item -Recurse -Force $lib }
            Copy-Item -Recurse samples\library $lib
            $p = Start-Process winui-out\SubScrub.exe -ArgumentList "--shots", "`"$dir`"", "--library", "`"$lib`"", "--theme", $t, "--size", $size -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(1200000)) { $p.Kill(); $fail += "QA run ($t$tag) did not finish" }
            if (Test-Path "$dir\diagnose.txt") { Write-Host "--- XAML check ($t$tag)"; Get-Content "$dir\diagnose.txt"; Remove-Item "$dir\diagnose.txt" }
            if (Test-Path "$dir\crash.txt") { Get-Content "$dir\crash.txt"; $fail += "SubScrub crashed ($t$tag)"; Remove-Item "$dir\crash.txt" }
            if (Test-Path "$dir\problems-$t$tag.txt") { Get-Content "$dir\problems-$t$tag.txt"; $fail += "QA problems ($t$tag)" }
            Write-Host "--- timings ($t$tag)"
            if (Test-Path "$dir\timings-$t$tag.txt") { Get-Content "$dir\timings-$t$tag.txt" }
            if (Test-Path "$dir\qa-$t$tag.json") {
              Write-Host "--- saved videos ($t$tag)"
              dotnet run --project winui/SubScrub.Engine.Tests -c Release --no-build -- --qa-check "$dir\qa-$t$tag.json" samples\library
              if ($LASTEXITCODE -ne 0) { $fail += "saved videos are wrong ($t$tag)" }
            } else { $fail += "no qa-$t$tag.json: the save didn't finish" }
          }
          Get-ChildItem $dir | Format-Table Name, Length
          if (Test-Path "$dir\screen-capture-errors.txt") { Get-Content "$dir\screen-capture-errors.txt" }
          if ($fail.Count -gt 0) { throw ($fail -join "; ") }

      # the installer for the WinUI app; it installs over SubScrub 3.x (same AppId, folder and Start-menu name)
      - name: Build the WinUI installer (SubScrub-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          [xml]$proj = Get-Content winui\SubScrub\SubScrub.csproj
          $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Split('-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=..\winui-out" installer\SubScrub-WinUI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path dist-winui\SubScrub-Setup.exe)) { throw "dist-winui\SubScrub-Setup.exe was not made" }
          Get-Item dist-winui\SubScrub-Setup.exe | Format-Table Name, Length

      # quietly, as the in-app updater does: install, check it starts, install over the top, uninstall
      - name: Smoke-test the WinUI installer
        shell: pwsh
        run: |
          function Run-Quietly($file, $argList) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "$file did not finish within 5 minutes" }
            return $p.ExitCode
          }
          $dir = Join-Path $env:RUNNER_TEMP "SubScrubWinUI"
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup-winui.log")
          $code = Run-Quietly dist-winui\SubScrub-Setup.exe $setupArgs
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-winui.log" -Tail 40; throw "installer exit code $code" }
          foreach ($f in 'SubScrub.exe', 'unins000.exe', 'SubScrub.pri') { if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" } }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\SubScrub.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut" }
          Start-Sleep -Seconds 10                   # a quiet install starts the app by itself
          $run = @(Get-Process SubScrub -ErrorAction SilentlyContinue)
          if ($run.Count -eq 0) { throw "the installed SubScrub did not start" }
          $run | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Explorer's right-click entry, per user, for videos, subtitle files and folders
          $menu = @('.mkv', '.mp4', '.m4v', '.avi', '.mov', '.webm', '.srt', '.ass', '.ssa', '.vtt' | ForEach-Object { "HKCU:\Software\Classes\SystemFileAssociations\$_\shell\SubScrub" }) + 'HKCU:\Software\Classes\Directory\shell\SubScrub'
          foreach ($k in $menu) {
            if (-not (Test-Path "$k\command")) { throw "no right-click entry at $k" }
            $cmd = (Get-Item "$k\command").GetValue('')
            if ($cmd -ne "`"$dir\SubScrub.exe`" `"%1`"") { throw "wrong command at ${k}: $cmd" }
            if ((Get-Item $k).GetValue('') -ne 'Clean subtitles with SubScrub') { throw "wrong menu text at $k" }
          }
          # one window: a second start (what Explorer does for each selected file) hands its file over and quits
          $log = Join-Path $env:RUNNER_TEMP "engine-single.log"
          $first = Start-Process "$dir\SubScrub.exe" -ArgumentList '--log', "`"$log`"" -PassThru
          Start-Sleep -Seconds 10
          $video = (Get-ChildItem samples\library\Blade.Runner*.mkv | Select-Object -First 1).FullName
          $second = Start-Process "$dir\SubScrub.exe" -ArgumentList "`"$video`"" -PassThru
          $null = $second.Handle
          if (-not $second.WaitForExit(30000)) { throw "a second SubScrub didn't hand its file to the first one and quit" }
          for ($i = 0; $i -lt 20 -and -not (Select-String -Path $log -SimpleMatch 'Blade.Runner' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          $n = @(Get-Process SubScrub -ErrorAction SilentlyContinue).Count
          if ($n -ne 1) { throw "expected one SubScrub window, found $n" }
          if (-not (Select-String -Path $log -SimpleMatch 'Blade.Runner' -Quiet)) { Get-Content $log -ErrorAction SilentlyContinue; throw "the open window didn't add the file it was handed" }
          Write-Host "A second start handed its file to the open window"
          Get-Process SubScrub -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $code = Run-Quietly dist-winui\SubScrub-Setup.exe $setupArgs                        # an upgrade over the top
          if ($code -ne 0) { throw "second install exit code $code" }
          Start-Sleep -Seconds 6
          Get-Process SubScrub -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $null = Run-Quietly "$dir\unins000.exe" @('/VERYSILENT', '/SUPPRESSMSGBOXES')
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\SubScrub.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\SubScrub.exe") { throw "the uninstaller left SubScrub.exe behind" }
          if (Test-Path $lnk) { throw "the uninstaller left the Start-menu shortcut" }
          foreach ($k in $menu) { if (Test-Path $k) { throw "the uninstaller left the right-click entry at $k" } }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SubScrub-WinUI-Setup
          path: dist-winui/SubScrub-Setup.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SubScrub-WinUI
          path: winui-out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winui-screenshots
          path: winui-shots/
          if-no-files-found: warn

      # artifact downloads are blocked from cloud Claude sessions, so the same images also go to a throwaway branch
      # (sample data only; force-pushed each run, never merged)
      - name: Publish the screenshots to the winui-screenshots branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          [ -d winui-shots ] || exit 0
          cd winui-shots
          git init -q -b winui-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "WinUI screenshots for ${{ github.event.pull_request.head.sha }}"
          # two runs on one commit (push and pull_request) race here; the other one's images are the same
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" winui-screenshots \
            || echo "::warning::another run updated winui-screenshots first"

  # a release: "Run workflow" on main with the version typed in (or a vX.Y.Z tag). Builds the native app (WinUI) and
  # its installer, checks the version matches winui/SubScrub/SubScrub.csproj, and publishes the GitHub Release with
  # SubScrub-Setup.exe (what the in-app update downloads) and the app folder as a zip
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check the version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content winui\SubScrub\SubScrub.csproj
          $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $want = if ("${{ inputs.version }}" -ne "") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.ref }}" -ne "refs/heads/main") { throw "Releases can only be started from main" }
          if ($v -ne $want) { throw "Typed version $want does not match winui/SubScrub/SubScrub.csproj ($v)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app
        shell: pwsh
        run: |
          dotnet publish winui/SubScrub/SubScrub.csproj -c Release -r win-x64 -p:Platform=x64 -o winui-out
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Get-ChildItem winui-out\*.pri)) { throw "no .pri file in the output: the XAML could not load" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=..\winui-out" installer\SubScrub-WinUI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          Compress-Archive -Path winui-out\* -DestinationPath "dist-winui\SubScrub-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Smoke-test the installed app starts
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "SubScrubRelease"
          $p = Start-Process dist-winui\SubScrub-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "the installer did not finish" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          $run = @(Get-Process SubScrub -ErrorAction SilentlyContinue)
          if ($run.Count -eq 0) { throw "the installed SubScrub did not start" }
          $run | Stop-Process -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SubScrub ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-winui/SubScrub-Setup.exe
            dist-winui/SubScrub-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
